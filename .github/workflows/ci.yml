name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill structure
        run: python3 tools/validate_skill.py
      - name: Scan for secrets and private paths
        run: python3 tools/check_secrets.py
      - name: Check shell syntax
        run: |
          for file in skill/classical-poem-silk-video/scripts/*.sh; do
            bash -n "$file"
          done
      - name: Compile Python scripts
        run: python3 -m py_compile skill/classical-poem-silk-video/scripts/*.py
      - name: Validate installer
        run: sh -n install.sh
